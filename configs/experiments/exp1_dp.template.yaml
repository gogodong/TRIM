# Configuration file for Exp-1 differential privacy evaluation.
experiment_id: exp1_dp_k235
results_root: results/exp1_dp

dataset:
  key: income
  data_path: null
  generalization_tree_path: null
  expected_nrows: 120000
  expected_val_size: 0.15
  expected_test_size: 0.15
  expected_split_seed: 42

release:
  target_k: 235

methods: [original, mondrian, trim]

training:
  seeds: [42, 43, 44, 45, 46]
  optimizer: sgd
  hidden_sizes: [32, 32]
  epochs: 20
  learning_rate: 0.1
  weight_decay: 0.001
  batch_size: 256
  max_grad_norm: 5.0
  delta: 1.0e-5
  accountant: prv
  poisson_sampling: true
  x_values: [5, 2, 1.5]
  epsilon_tolerance: 0.01
  dtype: float32
  device: cuda
  allow_cpu_fallback: true

summary:
  noninferiority_margin: 0.01
  confidence_level: 0.95
