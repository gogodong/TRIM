# Configuration file for Exp-6b2. Copy it before changing parameters.
# Supply tolerance with the required --tolerance option.
experiment_id: exp6b2_selection
experiment_kind: exp6b2_selection
results_root: results/exp6b2_selection
run_prefix: exp6b2

# IF uses the Exp-33 interpretation of the Exp-32 fixed-original Yang influence
# representation: project it onto validation loss to obtain Utility Delta.
yang_if:
  model:
    family: mlp
    hidden_sizes: [32, 32]
    epochs: 300
    lr: 0.01
    weight_decay: 0.001
    warm_start: false
  horizontal_last:
    damping: 0.001
    cg_max_iter: 50
    cg_tolerance: 0.00001
  vertical_all:
    damping: 0.001
    cg_max_iter: 50
    cg_tolerance: 0.00001

base_task:
  dataset: pubcov
  device: cuda
  dtype: float32
  allow_cpu_fallback: true
  initial_sample_fraction: 0.01
  model_name: xgboost
  model:
    downstream:
      family: xgboost
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.1
      subsample: 1.0
      colsample_bytree: 1.0
      reg_lambda: 1.0
      min_child_weight: 1.0
      tree_method: hist
      eval_metric: logloss
      n_jobs: 1
      warm_start: false
    proxy:
      family: torch_logistic
      max_iter: 300
    estimator:
      family: torch_logistic
      max_iter: 300
      warm_start: true
      lbfgs_history_size: 100
      line_search_fn: strong_wolfe
  pipeline:
    nrows: 152676
    val_size: 0.15
    test_size: 0.15
    max_iterations: 50
    rank_top_k: 7
    release_target_k: null
    stop_on_utility: true
    record_iteration_test_metrics: true

axes:
  - name: method
    values:
      - {label: TRIM, patch: {method: TRIM}}
      - {label: Privacy, patch: {method: Privacy}}
      - {label: Utility, patch: {method: Utility}}
      - {label: Random, patch: {method: Random}}
      - {label: IF, patch: {method: IF}}
  - name: seed
    values:
      - {label: 42, patch: {pipeline: {random_state: 42}}}
