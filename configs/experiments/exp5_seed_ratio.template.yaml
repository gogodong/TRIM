# Configuration file for the Exp-5 seed-ratio evaluation.
experiment_id: exp5_seed_ratio
experiment_kind: exp5_seed_ratio
results_root: results/exp5_seed_ratio
run_prefix: exp5_ratio

base_task:
  dataset: income
  device: cuda
  dtype: float32
  allow_cpu_fallback: true
  report_tolerance: 0.055
  model_name: mlp
  model:
    downstream:
      family: mlp
      hidden_sizes: [32, 32]
      epochs: 300
      lr: 0.01
      weight_decay: 0.001
    proxy:
      family: torch_logistic
      max_iter: 300
    estimator:
      family: torch_logistic
      max_iter: 300
  pipeline:
    nrows: 120000
    tolerance: 0.02
    val_size: 0.15
    test_size: 0.15
    max_iterations: 50
    rank_top_k: 7
    stop_on_utility: false
    record_iteration_test_metrics: true

axes:
  - name: ratio
    values:
      - {label: 0p001, patch: {initial_sample_fraction: 0.001}}
      - {label: 0p002, patch: {initial_sample_fraction: 0.002}}
      - {label: 0p004, patch: {initial_sample_fraction: 0.004}}
      - {label: 0p006, patch: {initial_sample_fraction: 0.006}}
      - {label: 0p008, patch: {initial_sample_fraction: 0.008}}
      - {label: 0p01, patch: {initial_sample_fraction: 0.01}}
      - {label: 0p012, patch: {initial_sample_fraction: 0.012}}
      - {label: 0p016, patch: {initial_sample_fraction: 0.016}}
      - {label: 0p02, patch: {initial_sample_fraction: 0.02}}
      - {label: 0p024, patch: {initial_sample_fraction: 0.024}}
      - {label: 0p028, patch: {initial_sample_fraction: 0.028}}
      - {label: 0p032, patch: {initial_sample_fraction: 0.032}}
      - {label: 0p04, patch: {initial_sample_fraction: 0.04}}
  - name: seed
    values:
      - {label: 42, patch: {pipeline: {random_state: 42}}}
      - {label: 43, patch: {pipeline: {random_state: 43}}}
      - {label: 44, patch: {pipeline: {random_state: 44}}}
      - {label: 45, patch: {pipeline: {random_state: 45}}}
      - {label: 46, patch: {pipeline: {random_state: 46}}}
