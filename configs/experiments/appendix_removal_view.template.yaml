# Configuration file for the appendix removal-view evaluation.
experiment_id: appendix_removal_view
experiment_kind: appendix_removal_view
results_root: results/appendix_removal_view
run_prefix: removal_view

base_task:
  task_type: classification
  device: cuda
  dtype: float32
  allow_cpu_fallback: true
  model_name: mlp
  model:
    downstream:
      family: mlp
      hidden_sizes: [32, 32]
      epochs: 300
      lr: 0.01
      weight_decay: 0.001
    proxy:
      family: mlp
      hidden_sizes: [32, 32]
      epochs: 300
      lr: 0.01
      weight_decay: 0.001
    estimator:
      family: torch_logistic
      max_iter: 300
  pipeline:
    val_size: 0.15
    test_size: 0.15
    max_iterations: 50
    rank_top_k: 7
    exchange_pool_size: 12
    enable_exchange: true
    greedy_ratio_epsilon: 1.0e-6

axes:
  - name: dataset
    values:
      - label: income
        patch:
          dataset: income
          pipeline: {nrows: 120000, tolerance: 0.05}
      - label: pubcov
        patch:
          dataset: pubcov
          pipeline: {nrows: 92867, tolerance: 0.05}
      - label: diabetes
        patch:
          dataset: diabetes
          pipeline: {nrows: 101766, tolerance: 0.02}
      - label: bm
        patch:
          dataset: bm
          pipeline: {nrows: 45211, tolerance: 0.005}
  - name: seed
    values:
      - {label: 42, patch: {pipeline: {random_state: 42}}}
      - {label: 43, patch: {pipeline: {random_state: 43}}}
      - {label: 44, patch: {pipeline: {random_state: 44}}}
      - {label: 45, patch: {pipeline: {random_state: 45}}}
      - {label: 46, patch: {pipeline: {random_state: 46}}}
