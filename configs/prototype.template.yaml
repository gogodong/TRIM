# Configuration file for a TRIM example. Relative paths are resolved from the
# project root.
dataset: income
data_path: null
generalization_tree_path: null
results_dir: results/trim_example
device: cuda
dtype: float32
allow_cpu_fallback: true

model:
  downstream:
    family: torch_logistic
    max_iter: 100
  proxy:
    family: torch_logistic
    max_iter: 100
  estimator:
    family: torch_logistic
    max_iter: 100

pipeline:
  tolerance: 0.002
  nrows: 10000
  val_size: 0.15
  test_size: 0.15
  random_state: 42
  max_iterations: 5
  initial_sample_size: 100
  rank_top_k: 3
  reference_model_filtering: false
  run_tag: trim_example
