name: trim

# Paper-facing GPU reference environment.
channels:
  - nvidia/label/cuda-12.2.2
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10.19
  - pip>=24,<26
  - cuda-toolkit=12.2.2
  - numpy>=1.26,<1.27
  - pandas>=2.3,<2.4
  - scipy>=1.15,<1.16
  - scikit-learn>=1.7,<1.8
  - pyyaml>=6.0,<6.1
  - matplotlib>=3.8,<3.9
  - xgboost>=3.2,<3.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.9.1+cu126
      - folktables==0.0.12
      - opacus>=1.6,<1.7
